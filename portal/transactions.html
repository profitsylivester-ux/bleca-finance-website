<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F2A44">
  <title>Transactions | BLECA Finance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<body class="portal-dashboard">

  <header class="portal-header">
    <div class="portal-header-left">
      <img src="../images/logo.png" alt="BLECA SmartLabs" class="portal-header-logo">
      <span class="portal-header-title">BLECA Finance Portal</span>
    </div>

    <div class="portal-header-right">
      <span id="userGreeting" class="portal-user-greeting"></span>
      <button type="button" id="themeToggle" class="portal-theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      <button type="button" id="logoutBtn" class="portal-logout" data-i18n="nav.logout">Logout</button>
    </div>
  </header>

  <nav class="portal-nav" aria-label="Portal navigation">
    <a href="dashboard.html" data-i18n="nav.dashboard">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
      Dashboard
    </a>
    <a href="transactions.html" class="active" data-i18n="nav.transactions">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Transactions
    </a>
    <a href="documents.html" data-i18n="nav.documents">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Documents
    </a>
    <a href="activity.html" class="ceo-only" data-ceo-only hidden data-i18n="nav.activity">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Activity
    </a>
    <a href="profile.html" data-i18n="nav.profile">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <main class="portal-content">

    <div class="page-header">
      <div>
        <h1 class="portal-page-title" data-i18n="tx.pageTitle">Transactions</h1>
        <p class="portal-page-subtitle" data-i18n="tx.pageSubtitle">All financial activity of the department.</p>
      </div>

      <div class="header-actions">
        <button type="button" id="exportTransactions" class="btn-new btn-export" data-i18n="tx.exportCsv">Export CSV</button>
        <button type="button" id="openNewTransaction" class="btn-new" data-i18n="tx.newTransaction">
          + New Transaction
        </button>
      </div>
    </div>

    <div class="transaction-search">
      <label class="visually-hidden" for="transactionSearch" data-i18n="tx.searchPlaceholder">Search transactions</label>
      <input type="search" id="transactionSearch" placeholder="Search by description, category, or project..." data-i18n-placeholder="tx.searchPlaceholder">
    </div>

    <div class="filter-tabs">
      <button type="button" class="filter-tab active" data-filter="all" data-i18n="tx.filterAll">All</button>
      <button type="button" class="filter-tab" data-filter="pending" data-i18n="tx.filterPending">Pending</button>
      <button type="button" class="filter-tab" data-filter="approved" data-i18n="tx.filterApproved">Approved</button>
      <button type="button" class="filter-tab" data-filter="rejected" data-i18n="tx.filterRejected">Rejected</button>
    </div>

    <section class="portal-section">
      <div id="transactionsList" class="portal-list">
        <p class="portal-empty">Loading...</p>
      </div>
    </section>

  </main>

  <!-- NEW TRANSACTION MODAL -->
  <div id="newTransactionModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="tx.newTitle">New Transaction</h2>
        <button type="button" class="modal-close" id="closeNewModal" aria-label="Close">✕</button>
      </div>

      <form id="newTransactionForm" class="modal-body">
        <div class="form-group">
          <label for="txDate" data-i18n="tx.labelDate">Date</label>
          <input type="date" id="txDate" required>
        </div>

        <div class="form-group">
          <label for="txDescription" data-i18n="tx.labelDescription">Description</label>
          <input type="text" id="txDescription" placeholder="e.g. Bootcamp ticket sales" data-i18n-placeholder="tx.descriptionPlaceholder" required>
        </div>

        <div class="form-group">
          <label for="txAmount" data-i18n="tx.labelAmount">Amount</label>
          <input type="number" id="txAmount" min="1" step="1" required>
        </div>

        <div class="form-group">
          <label for="txCurrency" data-i18n="tx.labelCurrency">Currency</label>
          <select id="txCurrency" required>
            <option value="TZS" selected data-i18n="tx.currencyTZS">TZS — Tanzanian Shilling</option>
            <option value="USD" data-i18n="tx.currencyUSD">USD — US Dollar</option>
            <option value="KES" data-i18n="tx.currencyKES">KES — Kenyan Shilling</option>
            <option value="EUR" data-i18n="tx.currencyEUR">EUR — Euro</option>
            <option value="GBP" data-i18n="tx.currencyGBP">GBP — British Pound</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txType" data-i18n="tx.labelType">Type</label>
          <select id="txType" required>
            <option value="income" data-i18n="tx.typeIncome">Income</option>
            <option value="expense" data-i18n="tx.typeExpense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txCategory" data-i18n="tx.labelCategory">Category</label>
          <select id="txCategory">
            <option value="Training" data-i18n="tx.categoryTraining">Training</option>
            <option value="Consulting" data-i18n="tx.categoryConsulting">Consulting</option>
            <option value="Software" data-i18n="tx.categorySoftware">Software</option>
            <option value="Cloud" data-i18n="tx.categoryCloud">Cloud</option>
            <option value="Transport" data-i18n="tx.categoryTransport">Transport</option>
            <option value="Marketing" data-i18n="tx.categoryMarketing">Marketing</option>
            <option value="Salaries" data-i18n="tx.categorySalaries">Salaries</option>
            <option value="Hardware" data-i18n="tx.categoryHardware">Hardware</option>
            <option value="Other" selected data-i18n="tx.categoryOther">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txProject" data-i18n="tx.labelProject">Project</label>
          <input type="text" id="txProject" placeholder="e.g. Iventika, Uzanite, General" value="General" data-i18n-placeholder="tx.projectPlaceholder">
        </div>

        <div class="form-group">
          <label for="txPaymentMethod" data-i18n="tx.labelPaymentMethod">Payment Method</label>
          <select id="txPaymentMethod">
            <option value="Cash" selected data-i18n="tx.methodCash">Cash</option>
            <option value="Bank" data-i18n="tx.methodBank">Bank</option>
            <option value="Mobile Money" data-i18n="tx.methodMobileMoney">Mobile Money</option>
          </select>
        </div>

        <p id="newTxError" class="portal-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelNewModal" data-i18n="tx.cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="submitNewTx" data-i18n="tx.save">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- REJECTION MODAL -->
  <div id="rejectModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="tx.rejectTitle">Reject Transaction</h2>
        <button type="button" class="modal-close" id="closeRejectModal" aria-label="Close">✕</button>
      </div>

      <form id="rejectForm" class="modal-body">
        <p class="modal-hint" data-i18n="tx.rejectHint">
          Please explain why this transaction is being rejected. This will be visible to the person who submitted it.
        </p>

        <div class="form-group">
          <label for="rejectReason" data-i18n="tx.rejectLabel">Reason for rejection</label>
          <textarea
            id="rejectReason"
            rows="4"
            placeholder="e.g. Missing receipt, wrong category, duplicate entry"
            data-i18n-placeholder="tx.rejectPlaceholder"
            required
          ></textarea>
        </div>

        <p id="rejectError" class="portal-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelRejectModal" data-i18n="tx.cancel">Cancel</button>
          <button type="submit" class="btn-danger" id="submitReject" data-i18n="tx.confirmReject">Confirm Rejection</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/portal.js"></script>
  <script type="module" src="../js/transactions.js"></script>
</body>
</html>
