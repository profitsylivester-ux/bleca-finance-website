<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F2A44">
  <title>Transactions | BLECA Finance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<body class="portal-dashboard">

  <header class="portal-header">
    <div class="portal-header-left">
      <img src="../images/logo.png" alt="BLECA SmartLabs" class="portal-header-logo">
      <span class="portal-header-title">BLECA Finance Portal</span>
    </div>

    <div class="portal-header-right">
      <span id="userGreeting" class="portal-user-greeting"></span>
      <button type="button" id="themeToggle" class="portal-theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      <button type="button" id="logoutBtn" class="portal-logout">Logout</button>
    </div>
  </header>

  <nav class="portal-nav" aria-label="Portal navigation">
    <a href="dashboard.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
      Dashboard
    </a>
    <a href="transactions.html" class="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Transactions
    </a>
    <a href="documents.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Documents
    </a>
    <a href="activity.html" class="ceo-only" data-ceo-only hidden>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Activity
    </a>
    <a href="profile.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <main class="portal-content">

    <div class="page-header">
      <div>
        <h1 class="portal-page-title">Transactions</h1>
        <p class="portal-page-subtitle">All financial activity of the department.</p>
      </div>

      <div class="header-actions">
        <button type="button" id="exportTransactions" class="btn-new btn-export">Export CSV</button>
        <button type="button" id="openNewTransaction" class="btn-new">
          + New Transaction
        </button>
      </div>
    </div>

    <div class="transaction-search">
      <label class="visually-hidden" for="transactionSearch">Search transactions</label>
      <input type="search" id="transactionSearch" placeholder="Search by description, category, or project...">
    </div>

    <div class="filter-tabs">
      <button type="button" class="filter-tab active" data-filter="all">All</button>
      <button type="button" class="filter-tab" data-filter="pending">Pending</button>
      <button type="button" class="filter-tab" data-filter="approved">Approved</button>
      <button type="button" class="filter-tab" data-filter="rejected">Rejected</button>
    </div>

    <section class="portal-section">
      <div id="transactionsList" class="portal-list">
        <p class="portal-empty">Loading...</p>
      </div>
    </section>

  </main>

  <!-- NEW TRANSACTION MODAL -->
  <div id="newTransactionModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>New Transaction</h2>
        <button type="button" class="modal-close" id="closeNewModal" aria-label="Close">✕</button>
      </div>

      <form id="newTransactionForm" class="modal-body">
        <div class="form-group">
          <label for="txDate">Date</label>
          <input type="date" id="txDate" required>
        </div>

        <div class="form-group">
          <label for="txDescription">Description</label>
          <input type="text" id="txDescription" placeholder="e.g. Bootcamp ticket sales" required>
        </div>

        <div class="form-group">
          <label for="txAmount">Amount (TZS)</label>
          <input type="number" id="txAmount" min="1" step="1" required>
        </div>

        <div class="form-group">
          <label for="txType">Type</label>
          <select id="txType" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txCategory">Category</label>
          <select id="txCategory">
            <option value="Training">Training</option>
            <option value="Consulting">Consulting</option>
            <option value="Software">Software</option>
            <option value="Cloud">Cloud</option>
            <option value="Transport">Transport</option>
            <option value="Marketing">Marketing</option>
            <option value="Salaries">Salaries</option>
            <option value="Hardware">Hardware</option>
            <option value="Other" selected>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="txProject">Project</label>
          <input type="text" id="txProject" placeholder="e.g. Iventika, Uzanite, General" value="General">
        </div>

        <div class="form-group">
          <label for="txPaymentMethod">Payment Method</label>
          <select id="txPaymentMethod">
            <option value="Cash" selected>Cash</option>
            <option value="Bank">Bank</option>
            <option value="Mobile Money">Mobile Money</option>
          </select>
        </div>

        <p id="newTxError" class="portal-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelNewModal">Cancel</button>
          <button type="submit" class="btn-primary" id="submitNewTx">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- REJECTION MODAL -->
  <div id="rejectModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Reject Transaction</h2>
        <button type="button" class="modal-close" id="closeRejectModal" aria-label="Close">✕</button>
      </div>

      <form id="rejectForm" class="modal-body">
        <p class="modal-hint">
          Please explain why this transaction is being rejected. This will be visible to the person who submitted it.
        </p>

        <div class="form-group">
          <label for="rejectReason">Reason for rejection</label>
          <textarea
            id="rejectReason"
            rows="4"
            placeholder="e.g. Missing receipt, wrong category, duplicate entry"
            required
          ></textarea>
        </div>

        <p id="rejectError" class="portal-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelRejectModal">Cancel</button>
          <button type="submit" class="btn-danger" id="submitReject">Confirm Rejection</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/portal.js"></script>
<script type="module" src="../js/transactions.js"></script>
</body>
</html>
