<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#0F2A44">
	<title>Staff Portal | BLECA SmartLabs</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body class="portal-page">
	<main class="portal-main">
		<section class="portal-card" aria-labelledby="portal-title">
			<a href="../index.html" class="portal-logo">
				<img src="../images/logo.png" alt="BLECA SmartLabs">
			</a>

			<p class="portal-eyebrow">Finance & Accounting</p>
			<h1 id="portal-title">Staff Portal</h1>
			<p class="portal-description">BLECA SmartLabs staff access</p>

			<p class="portal-notice" role="status">Staff sign-in is not available yet.</p>

			<form class="portal-form">
				<label for="staff-email">Work email</label>
				<input type="email" id="staff-email" name="email" autocomplete="username" disabled>

				<label for="staff-password">Password</label>
				<input type="password" id="staff-password" name="password" autocomplete="current-password" disabled>

				<button type="button" disabled>Sign in</button>
			</form>

			<a href="../index.html" class="portal-back">Return to the public website</a>
		</section>
	</main>
</body>
</html>
