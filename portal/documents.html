<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F2A44">
  <title>Documents | BLECA Finance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
</head>
<body class="portal-dashboard">

  <header class="portal-header">
    <div class="portal-header-left">
      <img src="../images/logo.png" alt="BLECA SmartLabs" class="portal-header-logo">
      <span class="portal-header-title">BLECA Finance Portal</span>
    </div>

    <div class="portal-header-right">
      <span id="userGreeting" class="portal-user-greeting"></span>
      <button type="button" id="themeToggle" class="portal-theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      <button type="button" id="logoutBtn" class="portal-logout">Logout</button>
    </div>
  </header>

  <nav class="portal-nav" aria-label="Portal navigation">
    <a href="dashboard.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/></svg>
      Dashboard
    </a>
    <a href="transactions.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Transactions
    </a>
    <a href="documents.html" class="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Documents
    </a>
    <a href="activity.html" class="ceo-only" data-ceo-only hidden>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Activity
    </a>
    <a href="profile.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>

  <main class="portal-content">

    <div class="page-header">
      <div>
        <h1 class="portal-page-title">Documents</h1>
        <p class="portal-page-subtitle">Receipts, invoices, contracts, and financial records.</p>
      </div>

      <div class="header-actions">
        <button type="button" id="openGenerateDoc" class="btn-new btn-generate">
          📄 Generate Document
        </button>

        <button type="button" id="openUploadDoc" class="btn-new">
          + Upload Document
        </button>
      </div>
    </div>

    <section class="portal-section">
      <div id="documentsList" class="portal-list">
        <p class="portal-empty">Loading...</p>
      </div>
    </section>

  </main>

  <!-- UPLOAD MODAL -->
  <div id="uploadModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Upload Document</h2>
        <button type="button" class="modal-close" id="closeUploadModal" aria-label="Close">✕</button>
      </div>

      <form id="uploadForm" class="modal-body">
        <div class="form-group">
          <label for="docType">Document Type</label>
          <select id="docType" required>
            <option value="Receipt">Receipt</option>
            <option value="Invoice">Invoice</option>
            <option value="Contract">Contract</option>
            <option value="Bank Statement">Bank Statement</option>
            <option value="Payment Voucher">Payment Voucher</option>
            <option value="Funding Document">Funding Document</option>
            <option value="Tax Document">Tax Document</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="docDescription">Description</label>
          <input type="text" id="docDescription" placeholder="e.g. Bootcamp venue receipt, October 2026">
        </div>

        <div class="form-group">
          <label for="docFile">File (PDF, image — max 5 MB)</label>
          <input type="file" id="docFile" accept=".pdf,.png,.jpg,.jpeg,.webp" required>
        </div>

        <p id="uploadError" class="portal-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelUploadModal">Cancel</button>
          <button type="submit" class="btn-primary" id="submitUpload">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- GENERATE DOCUMENT MODAL -->
  <div id="generateModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="generateTitle">Generate Document</h2>
        <button type="button" class="modal-close" id="closeGenerateModal" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">

        <!-- STEP 1: choose document type -->
        <div id="generateTypeStep">
          <p class="modal-hint">What kind of document do you want to create?</p>

          <div class="doc-type-grid">
            <button type="button" class="doc-type-card" data-doc-type="receipt">
              <span class="doc-type-icon-wrap">🧾</span>
              <span class="doc-type-name">Receipt</span>
            </button>

            <button type="button" class="doc-type-card" data-doc-type="invoice">
              <span class="doc-type-icon-wrap">📑</span>
              <span class="doc-type-name">Invoice</span>
            </button>

            <button type="button" class="doc-type-card" data-doc-type="certificate">
              <span class="doc-type-icon-wrap">🎓</span>
              <span class="doc-type-name">Certificate</span>
            </button>

            <button type="button" class="doc-type-card" data-doc-type="proposal">
              <span class="doc-type-icon-wrap">📄</span>
              <span class="doc-type-name">Proposal</span>
            </button>
          </div>
        </div>

        <!-- STEP 2: forms will be inserted here by JavaScript -->
        <div id="generateFormStep" hidden></div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="../js/portal.js"></script>
  <script type="module" src="../js/documents.js"></script>
  <script type="module" src="../js/generate.js"></script>
</body>
</html>
